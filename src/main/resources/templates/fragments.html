<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Timesheet'">Timesheet</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/picker.js}" defer></script>
    <script th:src="@{/js/time-fields.js}" defer></script>
</head>
<body>
<header th:fragment="header" class="topbar">
    <a class="brand" th:href="@{/}">Timesheet</a>
    <nav>
        <a th:href="@{/}">My week</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/weeks}">Team weeks</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/period}">Close period</a>
    </nav>
    <div th:if="${timer != null}" class="timer-chip" th:classappend="${timer.longRunning()} ? 'warn'" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span th:text="${timer.taskLabel()}">ACME · Dev</span>
        <strong id="timer-elapsed" th:attr="data-started=${timer.startedAt().toEpochMilli()}"
                th:text="${@fmt.duration(timer.elapsedSeconds())}">0:42</strong>
        <form th:unless="${timer.longRunning()}" id="timer-stop" th:action="@{/timer/stop}" method="post">
            <button type="submit" title="Stop and log  ( t )">Stop</button>
        </form>
        <a th:if="${timer.longRunning()}" th:href="@{/} + '#timer-review'">Review</a>
    </div>
    <form class="signout" th:action="@{/logout}" method="post">
        <span class="muted" sec:authentication="principal.displayName">Name</span>
        <button type="submit" class="link">Sign out</button>
    </form>
</header>

<!--
  The project <select> that picker.js turns into the searchable popover. Shared by
  the entry bar and the edit row. Needs ${taskGroups} (client heading -> tasks).
  required: whether picking nothing is an error (the bar) or means "keep it" (an edit).
-->
<select th:fragment="project-select(selectId, selectedTaskId, required)" th:id="${selectId}" name="taskId"
        aria-label="Project" data-picker th:attr="data-picker-required=${required} ? 'true' : null">
    <option value="">Project</option>
    <optgroup th:each="group : ${taskGroups}" th:label="${group.key}">
        <option th:each="t : ${group.value}" th:value="${t.id()}" th:text="${t.label()}"
                th:attr="data-project-id=${t.projectId()}, data-project=${t.projectName()},
                         data-task=${t.isDefault()} ? '' : ${t.taskName()}, data-colour=${t.colour()}"
                th:selected="${selectedTaskId != null and selectedTaskId == t.id()}">Strategic Planning</option>
    </optgroup>
</select>
</body>
</html>
