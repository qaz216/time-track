# Server overlay (used on AWS): docker compose -f compose.yaml -f compose.prod.yaml up -d --build
#
# - Only Caddy is reachable from outside (ports 80/443), with automatic HTTPS.
# - The app and Postgres publish no ports; they talk on the internal network.
# - The database password comes from .env (generated by deploy/aws/user-data.sh), never a default.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped

  app:
    ports: !reset []
    environment:
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Caddy terminates HTTPS: trust its X-Forwarded-* headers so redirects stay on https,
      # and only send the session cookie over HTTPS.
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      # 2 GB instance: leave room for Postgres and the OS.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates survive restarts
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
