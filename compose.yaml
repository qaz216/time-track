# docker compose up --build   ->  http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: timesheet
      POSTGRES_USER: timesheet
      POSTGRES_PASSWORD: timesheet
    # no host port: the app reaches it on the compose network, so a local
    # Postgres on 5432 can't clash
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet -d timesheet"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/timesheet
      DB_USER: timesheet
      DB_PASSWORD: timesheet
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "${APP_PORT:-8080}:8080"   # APP_PORT=8090 docker compose up if 8080 is taken

volumes:
  db-data:
