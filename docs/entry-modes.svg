<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"
     font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44546a"/>
    </marker>
    <style>
      .h1    { font-size: 21px; font-weight: 700; fill: #1f3864; }
      .h2    { font-size: 16px; font-weight: 700; fill: #1f3864; }
      .h2sub { font-size: 13px; fill: #44546a; }
      .bar   { fill: #ffffff; stroke: #dfe3ea; stroke-width: 1.2; }
      .focus { fill: none; stroke: #3358e0; stroke-width: 2; }
      .sep   { stroke: #c9ced8; stroke-width: 1; stroke-dasharray: 2 3; }
      .ph    { font-size: 14px; fill: #7a8291; }
      .val   { font-size: 14px; fill: #1f2937; }
      .proj  { font-size: 14px; fill: #3358e0; }
      .num   { font-size: 15px; font-weight: 600; fill: #1f2937; }
      .muted { font-size: 15px; font-weight: 600; fill: #7a8291; }
      .clock { font-size: 17px; font-weight: 700; fill: #1f2937; }
      .btn   { fill: #3358e0; }
      .stop  { fill: #d93b3b; }
      .btxt  { font-size: 13px; font-weight: 700; fill: #ffffff; letter-spacing: 0.6px; }
      .mode  { fill: none; stroke: #9aa1ad; stroke-width: 1.4; stroke-linecap: round; }
      .mode-on { fill: none; stroke: #3358e0; stroke-width: 1.4; stroke-linecap: round; }
      .lead  { fill: none; stroke: #44546a; stroke-width: 1.1; marker-end: url(#arrow); }
      .note  { font-size: 12.5px; fill: #1f2937; }
      .note b, .bold { font-weight: 700; }
      .small { font-size: 12px; fill: #44546a; }
      .panel { fill: #f6f9fd; stroke: #a6b8cf; stroke-width: 1.2; }
      .ok    { fill: #e2f0d9; stroke: #548235; stroke-width: 1.2; }
      .th    { font-size: 13px; font-weight: 700; fill: #1f3864; }
      .td    { font-size: 12.5px; fill: #1f2937; }
      .row   { fill: #ffffff; stroke: #d5dde8; stroke-width: 1; }
      .rowalt{ fill: #f6f9fd; stroke: #d5dde8; stroke-width: 1; }
    </style>
    <!-- the two mode icons, as drawn in the app -->
    <g id="ico-timer"><circle cx="8" cy="9" r="5.5"/><path d="M8 6v3l2 1.5M6.5 1.5h3"/></g>
    <g id="ico-list"><path d="M5.5 4h8M5.5 8h8M5.5 12h8"/><circle cx="2.5" cy="4" r=".6"/><circle cx="2.5" cy="8" r=".6"/><circle cx="2.5" cy="12" r=".6"/></g>
    <g id="ico-plus"><circle cx="8" cy="8" r="7" fill="none" stroke="#3358e0" stroke-width="1.4"/><path d="M8 4.5v7M4.5 8h7" stroke="#3358e0" stroke-width="1.4" stroke-linecap="round"/></g>
  </defs>

  <rect width="1600" height="860" fill="#ffffff"/>
  <text x="30" y="38" class="h1">Entry bar: Manual (ADD) vs Timer (START)</text>
  <text x="30" y="60" class="h2sub">Same bar, same description and project. The two icons on the right switch modes; the choice is remembered in this browser.</text>

  <!-- ============ MANUAL ============ -->
  <rect x="20" y="80" width="1560" height="250" rx="8" class="panel"/>
  <text x="40" y="108" class="h2">1 · Manual mode: log time that already happened</text>
  <text x="440" y="108" class="h2sub">list icon selected</text>

  <g transform="translate(40,124)">
    <rect width="1110" height="58" rx="6" class="bar"/>
    <rect x="2" y="2" width="378" height="54" rx="4" class="focus"/>
    <text x="22" y="34" class="ph">What have you worked on?</text>
    <line x1="400" y1="10" x2="400" y2="48" class="sep"/>
    <use href="#ico-plus" x="414" y="21"/><text x="438" y="34" class="proj">Project</text>
    <line x1="510" y1="10" x2="510" y2="48" class="sep"/>
    <text x="540" y="34" class="val">4:07 PM</text><text x="616" y="34" class="ph">-</text><text x="640" y="34" class="val">4:07 PM</text>
    <line x1="720" y1="10" x2="720" y2="48" class="sep"/>
    <text x="740" y="34" class="val">10/18/2026</text>
    <rect x="828" y="22" width="12" height="12" rx="2" fill="none" stroke="#1f2937" stroke-width="1.3"/><line x1="828" y1="26" x2="840" y2="26" stroke="#1f2937" stroke-width="1.3"/>
    <line x1="856" y1="10" x2="856" y2="48" class="sep"/>
    <text x="872" y="35" class="muted">0:00:00</text>
    <rect x="960" y="9" width="96" height="40" rx="5" class="btn"/><text x="1008" y="34" class="btxt" text-anchor="middle">ADD</text>
    <use href="#ico-timer" x="1076" y="8" class="mode"/>
    <use href="#ico-list" x="1076" y="32" class="mode-on"/>
  </g>

  <!-- manual callouts -->
  <path d="M190,196 V182" class="lead"/>
  <text x="40" y="214" class="note"><tspan class="bold">Description</tspan>: anything you like</text>
  <path d="M460,196 V182" class="lead"/>
  <text x="400" y="214" class="note"><tspan class="bold">Project</tspan>: searchable list</text>
  <path d="M640,196 V182" class="lead"/>
  <text x="560" y="214" class="note"><tspan class="bold">Start - End</tspan>: default to now</text>
  <text x="560" y="231" class="small">type 9, 915, 1:15 PM, 1715</text>
  <path d="M820,196 V182" class="lead"/>
  <text x="770" y="214" class="note"><tspan class="bold">Date</tspan>: any day</text>
  <text x="770" y="231" class="small">locks and submitted</text>
  <text x="770" y="246" class="small">weeks are checked</text>
  <path d="M975,210 H948 V184" class="lead"/>
  <text x="982" y="214" class="note"><tspan class="bold">Duration</tspan>: h:mm:ss</text>
  <text x="982" y="231" class="small">1:30, 90m, 45s; start, end</text>
  <text x="982" y="246" class="small">and duration keep in step</text>

  <g transform="translate(1180,124)">
    <rect width="380" height="186" rx="6" class="ok"/>
    <text x="16" y="26" class="th">Click ADD</text>
    <text x="16" y="50" class="td">• Saves the entry right away, to the exact second</text>
    <text x="16" y="72" class="td">• Keeps the project and day for the next one;</text>
    <text x="28" y="90" class="td">the cursor goes back to the description</text>
    <text x="16" y="112" class="td">• Every add, edit and delete is written to the audit trail</text>
    <text x="16" y="138" class="td"><tspan class="bold">No time given?</tspan> (start = end, no duration)</text>
    <text x="28" y="156" class="td">ADD starts a timer from now instead, so</text>
    <text x="28" y="174" class="td">nothing you start is lost.</text>
  </g>

  <!-- ============ TIMER ============ -->
  <rect x="20" y="346" width="1560" height="300" rx="8" class="panel"/>
  <text x="40" y="374" class="h2">2 · Timer mode: time it as you go</text>
  <text x="340" y="374" class="h2sub">clock icon selected</text>

  <text x="40" y="402" class="small bold">Ready</text>
  <g transform="translate(40,410)">
    <rect width="1110" height="58" rx="6" class="bar"/>
    <rect x="2" y="2" width="688" height="54" rx="4" class="focus"/>
    <text x="22" y="34" class="ph">What have you worked on?</text>
    <line x1="710" y1="10" x2="710" y2="48" class="sep"/>
    <use href="#ico-plus" x="726" y="21"/><text x="750" y="34" class="proj">Project</text>
    <line x1="826" y1="10" x2="826" y2="48" class="sep"/>
    <text x="892" y="36" class="clock" text-anchor="middle">00:00:00</text>
    <rect x="960" y="9" width="96" height="40" rx="5" class="btn"/><text x="1008" y="34" class="btxt" text-anchor="middle">START</text>
    <use href="#ico-timer" x="1076" y="8" class="mode-on"/>
    <use href="#ico-list" x="1076" y="32" class="mode"/>
  </g>

  <text x="40" y="502" class="small bold">Running</text>
  <g transform="translate(40,510)">
    <rect width="1110" height="58" rx="6" class="bar"/>
    <text x="22" y="34" class="val">Roadmap workshop</text>
    <text x="160" y="34" class="proj">Strategic Planning</text>
    <line x1="826" y1="10" x2="826" y2="48" class="sep"/>
    <text x="892" y="36" class="clock" text-anchor="middle">0:12:34</text>
    <rect x="960" y="9" width="96" height="40" rx="5" class="stop"/><text x="1008" y="34" class="btxt" text-anchor="middle">STOP</text>
    <use href="#ico-timer" x="1076" y="8" class="mode-on"/>
    <use href="#ico-list" x="1076" y="32" class="mode"/>
  </g>
  <path d="M1048,478 C1080,490 1080,500 1060,516" class="lead"/>
  <text x="1040" y="494" class="small" text-anchor="end">click START or press t</text>

  <text x="40" y="596" class="note"><tspan class="bold">No start, end, date or duration boxes</tspan>: the clock supplies them.</text>
  <text x="40" y="616" class="note">The elapsed time also ticks in the page header, so you can see it from anywhere.</text>
  <text x="640" y="596" class="note"><tspan class="bold">One timer per person.</tspan> Starting another logs the running one first.</text>
  <text x="640" y="616" class="note">Press t (or STOP) to stop it.</text>

  <g transform="translate(1180,410)">
    <rect width="380" height="210" rx="6" class="ok"/>
    <text x="16" y="26" class="th">Click STOP</text>
    <text x="16" y="50" class="td">• Logs an entry from the start time to now,</text>
    <text x="28" y="68" class="td">to the exact second (under a minute still counts)</text>
    <text x="16" y="92" class="td">• Ran past midnight? It is split into one</text>
    <text x="28" y="110" class="td">entry per day</text>
    <text x="16" y="134" class="td">• Goes through the same checks and audit trail</text>
    <text x="28" y="152" class="td">as a manual entry</text>
    <text x="16" y="176" class="td">• Survives closing the browser: the start time</text>
    <text x="28" y="194" class="td">is stored on the server</text>
  </g>

  <!-- ============ SIDE BY SIDE ============ -->
  <text x="40" y="684" class="h2">At a glance</text>
  <g transform="translate(40,696)">
    <rect width="1520" height="30" class="rowalt"/>
    <text x="14" y="20" class="th">Question</text><text x="300" y="20" class="th">Manual · ADD</text><text x="910" y="20" class="th">Timer · START</text>
    <rect y="30" width="1520" height="28" class="row"/>
    <text x="14" y="49" class="td">Use it when</text><text x="300" y="49" class="td">the work is done and you know the times</text><text x="910" y="49" class="td">you are starting the work now</text>
    <rect y="58" width="1520" height="28" class="rowalt"/>
    <text x="14" y="77" class="td">You type</text><text x="300" y="77" class="td">description, project, start/end or duration, day</text><text x="910" y="77" class="td">description and project only</text>
    <rect y="86" width="1520" height="28" class="row"/>
    <text x="14" y="105" class="td">An entry is saved</text><text x="300" y="105" class="td">immediately, on ADD</text><text x="910" y="105" class="td">on STOP, for the time that has passed</text>
    <rect y="114" width="1520" height="28" class="rowalt"/>
    <text x="14" y="133" class="td">Day</text><text x="300" y="133" class="td">any day you pick (past or future)</text><text x="910" y="133" class="td">today, split at midnight if it runs over</text>
  </g>
</svg>
